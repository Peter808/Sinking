# ==========================================================================
# Deploy site
# Builds the public site into ./_site and publishes it to GitHub Pages.
#   1. Copy the site files from main (HTML, CSS, JS, images)
#   2. Copy the latest JSON from the `data` branch into _site/data
#   3. scripts/prerender.js writes current values into the HTML
#   4. Publish
# Runs on every push to main, and after each data update.
# Repo setting required: Settings > Pages > Source: "GitHub Actions".
# ==========================================================================
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling a running one. Cancelling mid-deploy
# made GitHub Pages reject the next deploy ("Deployment cancelled").
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only public site files go into _site (no scripts, config, prompts)
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html css js images _site/
          for f in 404.html CNAME robots.txt sitemap.xml miami miami-beach hallandale-beach hollywood fort-lauderdale news resources; do
            [ -e "$f" ] && cp -r "$f" _site/ || true
          done
          [ -d data/curated ] && cp -r data/curated _site/data/ || true

      - name: Add latest data
        run: |
          if git fetch --depth 1 origin data; then
            git archive FETCH_HEAD | tar -x -C _site/data
            ls -la _site/data
          else
            echo "No data branch yet; site keeps its sample values."
          fi

      - name: Pre-render data into HTML
        run: node scripts/prerender.js _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
